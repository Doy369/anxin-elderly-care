<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心养老 · 前端页面预览</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
body {
  background:#EFF3F1;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  color:#14261F;
  padding:24px 16px 60px;
}
.page-head { max-width:1240px; margin:0 auto 22px; }
.page-head h1 { font-size:20px; font-weight:600; margin-bottom:6px; }
.page-head p { font-size:13px; color:#6B7C74; line-height:1.6; }
.hint {
  max-width:1240px; margin:0 auto 20px; background:#fff; border:1px solid #E6EFE9;
  border-radius:10px; padding:12px 16px; font-size:12.5px; color:#55665E; line-height:1.7;
}
.hint b { color:#15803D; }

.grid {
  max-width:1240px; margin:0 auto;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:26px;
}
.item { }
.item-label {
  font-size:12.5px; color:#55665E; margin-bottom:8px; display:flex; align-items:center; gap:7px;
}
.item-label b { color:#14261F; font-weight:600; }
.badge {
  background:#E9F6EE; color:#0B5F2C; font-size:10.5px; padding:2px 8px; border-radius:99px; font-weight:500;
}

/* 手机壳 */
.phone {
  width:300px; background:#fff; border:1px solid #DCE8E0; border-radius:26px;
  overflow:hidden; box-shadow:0 4px 16px rgba(20,60,40,.07);
}
.nav {
  background:#15803D; color:#fff; padding:11px 14px; text-align:center;
  font-size:14px; font-weight:600; position:relative;
}
.nav .back { position:absolute; left:13px; font-size:17px; font-weight:400; }
.tabbar {
  display:flex; background:#fff; border-top:1px solid #EEF4F0;
}
.tabbar div {
  flex:1; text-align:center; padding:8px 0 9px; font-size:10px; color:#7A8B85;
}
.tabbar div.on { color:#15803D; font-weight:600; }
.tabbar .ico { font-size:15px; display:block; margin-bottom:2px; }
.body {
  height:520px; overflow-y:auto; background:#fff; padding-bottom:14px;
  scrollbar-width:thin;
}
.body::-webkit-scrollbar { width:3px; }
.body::-webkit-scrollbar-thumb { background:#DCE8E0; border-radius:3px; }

/* ===== 通用组件（rpx*0.5 换算：1rpx ≈ 0.4px @300宽） ===== */
.pad { padding:0 14px; }
.card {
  background:#fff; border:1px solid #E6EFE9; border-radius:11px;
  padding:14px; margin-top:11px;
}
.ct { font-size:15px; font-weight:700; color:#14261F; margin-bottom:10px; }
.tag {
  display:inline-block; background:#E9F6EE; color:#0B5F2C;
  font-size:10px; padding:2px 7px; border-radius:99px; margin-right:5px;
}
.tag2 { background:#D9F1E2; }
.price { color:#0F7A38; font-weight:700; display:flex; align-items:baseline; }
.price s { font-size:11px; }
.price b { font-size:19px; }
.price em { font-size:10px; font-weight:400; color:#7A8B85; font-style:normal; }
.sec-t { font-size:16px; font-weight:700; margin-bottom:2px; }
.sec-s { font-size:11.5px; color:#7A8B85; margin-bottom:11px; }
.btn {
  height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700; border:none; width:100%;
}
.btn-p { background:#15803D; color:#fff; }
.btn-a { background:linear-gradient(135deg,#22A855 0%,#15803D 100%); color:#fff; }
.btn-g { background:#fff; color:#15803D; border:1.5px solid #15803D; }
.btn-s { height:33px; font-size:12.5px; border-radius:8px; padding:0 12px; width:auto; }
.inp {
  height:44px; background:#F4F8F5; border-radius:8px; padding:0 13px;
  font-size:14px; color:#14261F; display:flex; align-items:center;
}
.inp.ph { color:#9AA8A2; }
.lbl { font-size:13.5px; font-weight:600; margin-bottom:7px; display:block; }
.lbl i { color:#D64545; font-style:normal; margin-left:3px; }
textarea.inp { height:auto; min-height:70px; padding:11px 13px; line-height:1.6; align-items:flex-start; }
.row { display:flex; align-items:center; }
.chip {
  height:33px; padding:0 13px; border-radius:99px; background:#F4F8F5; border:1px solid transparent;
  display:flex; align-items:center; font-size:12.5px; color:#3D4F49; margin-right:7px; margin-bottom:7px;
}
.chip.on { background:#E9F6EE; border-color:#15803D; color:#15803D; font-weight:600; }
.empty { padding:60px 20px; text-align:center; }
.empty .e-i { font-size:40px; }
.empty .e-t { display:block; font-size:13px; color:#7A8B85; margin-top:12px; line-height:1.6; }
</style>
</head>
<body>

<div class="page-head">
  <h1>安心养老 · 前端页面预览</h1>
  <p>按小程序实际样式 1:1 还原，尺寸比例与真机一致（300px 宽 ≈ 375px 逻辑宽度等比）</p>
</div>

<div class="hint">
  <b>7 个页面</b> · 全部白底绿系（主绿 #15803D）· 正文 ≥30rpx 适老化字号 · 可左右滚动查看。
  超大字体开关在「我的」页，开启后字号会整体放大约 24%。

<div class="grid" id="grid"></div>

<script>
const $ = (h) => h;

function phone(label, badge, nav, body, tab) {
  return `<div class="item">
    <div class="item-label"><b>${label}</b><span class="badge">${badge}</span></div>
    <div class="phone">
      <div class="nav">${nav}</div>
      <div class="body">${body}</div>
      ${tab ? `<div class="tabbar">${tab}</div>` : ''}
    </div>
  </div>`;
}

  const t = [['首页','🏠'],['找服务','🔧'],['我的订单','📋'],['我的','👤']];
  return t.map(([n,i]) => `<div class="${n===active?'on':''}"><span class="ico">${i}</span>${n}</div>`).join('');
};

/* ========== 1. 首页 ========== */

const svcRow = (s) => `
